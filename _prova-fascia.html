<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>Prova — la finestra che si apre</title>
<link rel="stylesheet" href="style.css" />
<style>
  body { padding: 0; }
  .etichetta {
    font-family: var(--sans); font-size: 11px; letter-spacing: .22em;
    text-transform: uppercase; color: #8E8272; padding: 20px 26px 8px; margin: 0;
  }
  /* Tre copie della fascia vera, ognuna bloccata a un momento diverso
     dell'animazione. In pagina questi valori li produce lo scorrimento;
     qui l'animazione e' spenta apposta, per poterli guardare fermi. */
  .m0 .brace-video, .m1 .brace-video, .m2 .brace-video,
  .m0 .brace-video__filmato, .m1 .brace-video__filmato, .m2 .brace-video__filmato {
    animation: none !important;
  }
  .m0 .brace-video  { clip-path: inset(19% 22% 19% 22%); }
  .m0 .brace-video__filmato { transform: scale(1.16); }

  .m1 .brace-video  { clip-path: inset(9.5% 11% 9.5% 11%); }
  .m1 .brace-video__filmato { transform: scale(1.08); }

  .m2 .brace-video  { clip-path: inset(0 0 0 0); }
  .m2 .brace-video__filmato { transform: scale(1); }
</style>
</head>
<body>

<p class="etichetta">1 — appena entra dal basso (finestra chiusa, immagine ingrandita)</p>
<div class="m0">
  <div class="brace-video" aria-hidden="true">
    <video class="brace-video__filmato" poster="img/g-brace-video-poster.jpg" muted playsinline preload="none"></video>
  </div>
</div>

<p class="etichetta">2 — a metà strada</p>
<div class="m1">
  <div class="brace-video" aria-hidden="true">
    <video class="brace-video__filmato" poster="img/g-brace-video-poster.jpg" muted playsinline preload="none"></video>
  </div>
</div>

<p class="etichetta">3 — completamente entrata (finestra aperta, immagine posata)</p>
<div class="m2">
  <div class="brace-video" aria-hidden="true">
    <video class="brace-video__filmato" poster="img/g-brace-video-poster.jpg" muted playsinline preload="none"></video>
  </div>
</div>

</body>
</html>
